<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serviette — Print Table QR Codes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8F9FA; }
    .serif-brand { font-family: 'Playfair Display', serif; }
    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .qr-print-card { box-shadow: none !important; border: 1px solid #ddd !important; break-inside: avoid; }
    }
  </style>
</head>
<body class="p-8">
  <div class="max-w-4xl mx-auto">
    
    <!-- Generator Controls -->
    <div class="no-print bg-white p-6 rounded-2xl shadow-sm border border-neutral-200 mb-8">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h1 class="text-xl font-bold">Generate Restaurant Table Stands</h1>
          <p class="text-xs text-neutral-500">Generates unique table links with Serviette branding ready for printing</p>
        </div>
        <button onclick="window.print()" class="px-5 py-2.5 bg-black text-white text-xs font-semibold rounded-full hover:bg-neutral-800">
          Print Stand Cards
        </button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
        <div>
          <label class="block font-medium mb-1">Venue Slug</label>
          <input type="text" id="venueSlug" value="thecharlie" class="w-full p-2 border rounded-lg">
        </div>
        <div>
          <label class="block font-medium mb-1">Number of Tables</label>
          <input type="number" id="numTables" value="6" min="1" max="50" class="w-full p-2 border rounded-lg">
        </div>
        <div class="flex items-end">
          <button onclick="generateQRCodes()" class="w-full p-2.5 bg-neutral-100 hover:bg-neutral-200 font-semibold rounded-lg">
            Update QR Codes
          </button>
        </div>
      </div>
    </div>

    <!-- QR Print Grid -->
    <div id="qrGrid" class="grid grid-cols-2 md:grid-cols-3 gap-6"></div>

  </div>

  <script>
    function generateQRCodes() {
      const grid = document.getElementById('qrGrid');
      grid.innerHTML = '';
      const venue = document.getElementById('venueSlug').value;
      const count = parseInt(document.getElementById('numTables').value);

      for (let i = 1; i <= count; i++) {
        const tableNum = i < 10 ? '0' + i : i;
        const targetUrl = `https://serviette.com.au/feedback.html?store=${venue}&table=${tableNum}`;

        const card = document.createElement('div');
        card.className = "qr-print-card bg-white p-6 rounded-2xl border border-neutral-200 text-center shadow-sm flex flex-col items-center justify-between";
        card.innerHTML = `
          <div>
            <p class="serif-brand font-bold text-lg tracking-tight">SERVIETTE.</p>
            <p class="text-[10px] uppercase font-bold tracking-widest text-neutral-400 mt-0.5">Table Feedback</p>
          </div>
          
          <canvas id="qr-${i}" class="my-4"></canvas>
          
          <div>
            <div class="inline-block px-3 py-1 rounded-full bg-neutral-100 text-neutral-800 text-xs font-bold mb-1">
              Table ${tableNum}
            </div>
            <p class="text-[10px] text-neutral-500 font-medium">Scan to rate service & spin for rewards</p>
          </div>
        `;
        grid.appendChild(card);

        QRCode.toCanvas(document.getElementById(`qr-${i}`), targetUrl, {
          width: 140,
          margin: 1,
          color: { dark: '#000000', light: '#ffffff' }
        });
      }
    }
    generateQRCodes();
  </script>
</body>
</html>
